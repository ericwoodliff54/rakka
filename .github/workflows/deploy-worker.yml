# Publishes rakka-worker.js to Cloudflare automatically whenever it (or wrangler.toml) changes on main.
# You can also run it by hand from the Actions tab.
name: Deploy worker
on:
  push:
    branches: [main]
    paths:
      - 'rakka-worker.js'
      - 'wrangler.toml'
  workflow_dispatch: {}
concurrency:
  group: deploy-worker
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the file before publishing
        run: node --check rakka-worker.js
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 deploy
      - name: Confirm the live worker is healthy
        run: |
          sleep 8
          curl -fsS https://rakka-edge.ericwoodliff.workers.dev/health | tee health.json
          grep -q '"status":"online"' health.json
