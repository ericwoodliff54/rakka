# Builds a test Android app (APK) of Rakka that you can install on your phone.
# Run it from the Actions tab: "Build Android test app" -> Run workflow.
# When it finishes, open the run and download the "rakka-android-debug" file at the bottom.
name: Build Android test app
on:
  workflow_dispatch: {}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare the native build folder
        run: |
          mkdir -p native
          cp native-package.json native/package.json
          cp capacitor.config.json native/capacitor.config.json
          mkdir -p native/www
          # Only the files the app needs. The catalog is downloaded by the app itself after install.
          cp index.html app.css manifest.json favicon.png apple-touch-icon.png icon-192.png icon-512.png splash-mascot-sm.png staples_catalog.json native/www/
          cp -r js vendor native/www/

      - name: Check the app has native-app support
        run: grep -q "isNativePlatform" native/www/index.html

      - name: Install Capacitor and create the Android project
        working-directory: native
        run: |
          npm install
          npx cap add android

      - name: Add camera permission, icons and version
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 native-patch.py . native/android ${{ github.run_number }} "1.0.${{ github.run_number }}"

      - name: Copy the app into the Android project
        working-directory: native
        run: npx cap sync android

      - name: Build the test app
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Save the test app
        uses: actions/upload-artifact@v4
        with:
          name: rakka-android-debug
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

