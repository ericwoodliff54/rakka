name = "rakka-edge"
main = "rakka-worker.js"
compatibility_date = "2025-01-01"
keep_vars = true

kv_namespaces = [
  { binding = "RAKKA_COMMUNITY_DB", id = "13e138ca5e594e778782a18c622b2781" }
]

# Free trials now start from the purchase screen in the store version (Google Play), so turn off the old no-card trial.
[vars]
PLUS_TRIAL_DISABLED = "1"

[triggers]
crons = ["*/10 * * * *"]

# Edge rate limits for the AI (Gemini) endpoints. Limits are per Cloudflare location, per 60 seconds.
[[ratelimits]]
name = "RL_AI_IP"
namespace_id = "7101"

  [ratelimits.simple]
  limit = 20
  period = 60

[[ratelimits]]
name = "RL_AI_ALL"
namespace_id = "7102"

  [ratelimits.simple]
  limit = 600
  period = 60
